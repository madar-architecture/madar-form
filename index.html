<style>
  :root{
    --bg:#232D22; --bg-deep:#1B2319; --surface:#2C3829; --surface-2:#35432F;
    --gold:#D6C7A0; --gold-soft:#A89C78; --ink:#F1EBDB; --muted:#A9AE9C; --line:#46553F; --error:#E8A08A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  .app{min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;padding:20px 22px 24px;display:flex;flex-direction:column}

  .brandrow{display:flex;align-items:center;gap:12px}
  .brandrow img{width:46px;height:auto}
  .brand{font-size:15px;font-weight:600;line-height:1.35;color:var(--gold)}
  .brand small{display:block;font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--gold-soft);direction:ltr;text-align:right}

  .dim{position:relative;height:16px;margin:22px 0 0}
  .dim::before{content:'';position:absolute;right:0;left:0;top:50%;border-top:1px solid var(--line)}
  .dim .tick{position:absolute;top:2px;width:1px;height:12px;background:var(--line)}
  .dim .s{right:0;background:var(--gold)}
  .dim .e{left:0}
  .dim .fill{position:absolute;right:0;top:calc(50% - 1px);height:2px;width:0;background:var(--gold);transition:width .4s ease}
  .dim .fill::after{content:'';position:absolute;left:0;top:-5px;width:1px;height:12px;background:var(--gold)}

  .view{flex:1;display:flex;flex-direction:column}
  main{flex:1;padding-top:34px}
  .q{font-size:clamp(23px,6vw,29px);font-weight:600;line-height:1.5;color:var(--ink)}
  .help{margin-top:8px;font-size:15px;line-height:1.75;color:var(--muted)}

  input,textarea{width:100%;font:inherit;font-size:20px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:10px 2px;outline:none;transition:border-color .15s}
  input:focus,textarea:focus{border-color:var(--gold)}
  input::placeholder,textarea::placeholder{color:#6F7A66}
  input[dir=ltr]{text-align:right}
  textarea{min-height:130px;resize:vertical;font-size:17px;line-height:1.7;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
  .field{margin-top:30px}

  .options{margin-top:28px;display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:right;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
  .opt:hover{border-color:var(--gold-soft);background:var(--surface-2)}
  .opt .mark{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--gold-soft)}
  .opt[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg-deep)}
  .opt[aria-pressed="true"] .mark{border-color:var(--bg-deep);box-shadow:inset 0 0 0 4px var(--gold);background:var(--bg-deep)}

  .err{min-height:22px;margin-top:12px;font-size:14px;color:var(--error)}

  footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px}
  .btn{font:inherit;font-size:17px;font-weight:600;color:var(--bg-deep);background:var(--gold);border:0;border-radius:999px;padding:14px 32px;cursor:pointer;transition:filter .15s}
  .btn:hover{filter:brightness(1.07)}
  .btn:disabled{opacity:.55;cursor:default}
  .back{font:inherit;font-size:15px;color:var(--muted);background:none;border:0;padding:10px 4px;cursor:pointer}
  .back:hover{color:var(--gold)}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 4px}
  .center img{width:190px;height:auto;margin-bottom:34px}
  .center h1{font-size:clamp(26px,7vw,34px);font-weight:600;line-height:1.45;color:var(--ink)}
  .center p{max-width:32ch;margin-top:12px;font-size:17px;line-height:1.8;color:var(--muted)}
  .center .btn{margin-top:34px;padding:15px 56px}
  .center .fine{margin-top:14px;font-size:13px}
  .sig{margin-top:auto;padding-top:28px;font-size:13px;color:var(--gold-soft);text-align:center}

  .contact{display:grid;gap:10px;width:100%;max-width:320px;margin-top:30px}
  .contact a{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-size:17px;font-weight:600;border-radius:999px;padding:14px 20px}
  .contact .wa{background:var(--gold);color:var(--bg-deep)}
  .contact .call{border:1.5px solid var(--gold-soft);color:var(--gold)}
  .contact svg{width:20px;height:20px;flex:none}
  .other{margin-top:4px}
  .screen{animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  {id:'district', type:'choice', q:'في منطقة إيه؟', options:d => DISTRICTS[d.governorate] || [], other:'منطقة أخرى', when:d => !otherGov(d)},
  {id:'districtText', type:'text', q:'المدينة أو المنطقة', ph:'مثال: المنصورة', when:otherGov},
  {id:'unitStatus', type:'choice', q:'الوحدة حالتها إيه دلوقتي؟', options:['على الطوب','نص تشطيب','متشطبة ومحتاجة تجديد','لسه ما استلمتش']},
  {id:'area', type:'number', q:'مساحة الوحدة كام متر؟', help:'رقم تقريبي كفاية.', ph:'150',
    norm:normDigits, validate:v => (/^\d+$/.test(v) && +v >= 30 && +v <= 3000) || 'اكتب رقم بين 30 و 3000'},
  {id:'budget', type:'choice', q:'الميزانية المتوقعة للتشطيب؟', help:'محسوبة على مساحة وحدتك.', options:budgetOptions},
  {id:'contactTime', type:'choice', q:'أنسب وقت نكلمك فيه؟', options:['الصبح','بعد الضهر','بالليل']},
  {id:'address', type:'text', q:'العنوان بالتفصيل', help:'الكمبوند أو الشارع ورقم العمارة.', ph:'مثال: كمبوند ...، عمارة ...'},
  {id:'notes', type:'textarea', q:'فيه تفاصيل تانية تحب تقولها؟', help:'مثال: محتاج تصميم بس ولا تصميم وتنفيذ.', optional:true}
];

/* ====== المنطق ====== */
const view = document.getElementById('view');
const hdr = document.getElementById('hdr');
const fill = document.getElementById('fill');
document.querySelectorAll('.mark-logo').forEach(i => i.src = MARK);
const params = new URLSearchParams(location.search);
const SRC = (params.get('src') || params.get('utm_source') || '').slice(0, 40);

let data = {}, stack = [], curId = null, busy = false;

function normDigits(v){
  return v.replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c))
          .replace(/[۰-۹]/g, c => '۰۱۲۳۴۵۶۷۸۹'.indexOf(c))
          .replace(/[\s,،.\-]/g, '');
}
function normPhone(v){
  v = normDigits(v).replace(/^\+/, '').replace(/^00/, '');
  if (/^20\d{10}$/.test(v)) v = '0' + v.slice(2);
  return v;
}
const shown = s => !s.when || s.when(data);
const step = id => STEPS.find(s => s.id === id);
const text = (s, k) => typeof s[k] === 'function' ? s[k](data) : s[k];

function nextId(fromId){
  let i = fromId ? STEPS.findIndex(s => s.id === fromId) + 1 : 0;
  for (; i < STEPS.length; i++) if (shown(STEPS[i])) return STEPS[i].id;
  return null;
}
function go(id){ if (curId) stack.push(curId); curId = id; render(); }
function forward(){ const n = nextId(curId); n ? go(n) : submit(); }
function back(){ if (stack.length){ curId = stack.pop(); render(); } else intro(); }

function intro(){
  curId = null; stack = []; hdr.hidden = true;
  view.innerHTML = `
    <section class="center screen">
      <img src="${LOGO}" alt="مدار المعمار — Madar Architecture">
      <h1>خلّينا نعرف وحدتك</h1>
      <p>كام سؤال سريع، وفريق مدار المعمار هيتواصل معاك يحدد معاك الخطوة الجاية.</p>
      <button class="btn" type="button" id="start">ابدأ</button>
      <p class="fine">أقل من دقيقة</p>
    </section>`;
  document.getElementById('start').onclick = () => go(nextId(null));
}

function render(){
  const s = step(curId);
  const list = STEPS.filter(shown);
  hdr.hidden = false;
  fill.style.width = Math.round(list.indexOf(s) / list.length * 100) + '%';
  const last = !nextId(s.id);
  busy = false;

  view.innerHTML = `
    <main class="screen">
      <h1 class="q" id="q"></h1>
      <p class="help" id="help" hidden></p>
      <div id="body"></div>
      <p class="err" id="err" role="alert"></p>
    </main>
    <footer>
      <button class="back" type="button" id="back">رجوع</button>
      <button class="btn" type="button" id="next">${last ? 'ابعت الطلب' : 'التالي'}</button>
    </footer>`;
  document.getElementById('q').textContent = text(s, 'q');
  const helpTxt = [text(s, 'help'), s.optional ? 'اختياري.' : ''].filter(Boolean).join(' ');
  if (helpTxt){ const h = document.getElementById('help'); h.textContent = helpTxt; h.hidden = false; }

  const body = document.getElementById('body');
  const next = document.getElementById('next');
  document.getElementById('back').onclick = back;
  next.onclick = () => { if (commit(s)) forward(); };

  if (s.type === 'choice') buildChoice(s, body, next, last);
  else buildInput(s, body, next, last);
}

function buildInput(s, body, next, last){
  body.className = 'field';
  const el = document.createElement(s.type === 'textarea' ? 'textarea' : 'input');
  if (s.type !== 'textarea'){
    el.type = 'text';
    if (s.type === 'tel'){ el.inputMode = 'tel'; el.dir = 'ltr'; el.autocomplete = 'tel'; }
    if (s.ac) el.autocomplete = s.ac;
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); next.click(); } });
  }
  el.placeholder = s.ph || '';
  el.value = data[s.id] || '';
  el.maxLength = s.type === 'textarea' ? 500 : 60;
  el.setAttribute('aria-labelledby', 'q');
  body.appendChild(el);
  const label = () => { if (s.optional && !last) next.textContent = el.value.trim() ? 'التالي' : 'تخطي'; };
  el.addEventListener('input', () => { setErr(''); label(); });
  label();
  setTimeout(() => el.focus(), 60);
}

function buildChoice(s, body, next, last){
  body.className = 'options';
  body.setAttribute('role', 'group');
  body.setAttribute('aria-labelledby', 'q');
  const opts = text(s, 'options');
  const otherKey = s.id + '__other';
  if (data[s.id] && !data[otherKey] && !opts.includes(data[s.id])) delete data[s.id];
  const otherOn = !!data[otherKey];
  const press = target => body.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', b === target));
  const btn = (label, pressed, onPick) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt';
    b.setAttribute('aria-pressed', pressed);
    b.innerHTML = '<span class="mark"></span><span></span>';
    b.lastChild.textContent = label;
    b.onclick = onPick;
    body.appendChild(b);
    return b;
  };
  let otherWrap = null, inp = null;
  opts.forEach(o => {
    const b = btn(o, !otherOn && data[s.id] === o, () => {
      if (busy) return;
      data[s.id] = o; delete data[otherKey]; setErr(''); press(b);
      if (otherWrap) otherWrap.hidden = true;
      if (!nextId(s.id)){ next.hidden = false; next.textContent = 'ابعت الطلب'; return; }
      busy = true; setTimeout(() => { if (commit(s)) forward(); }, 220);
    });
  });
  if (s.other){
    const ob = btn(s.other, otherOn, () => {
      if (!data[otherKey]){ data[otherKey] = true; data[s.id] = ''; inp.value = ''; }
      press(ob); otherWrap.hidden = false; next.hidden = false;
      next.textContent = nextId(s.id) ? 'التالي' : 'ابعت الطلب';
      inp.focus();
    });
    otherWrap = document.createElement('div');
    otherWrap.className = 'other'; otherWrap.hidden = !otherOn;
    inp = document.createElement('input');
    inp.type = 'text'; inp.maxLength = 60; inp.placeholder = s.otherPh || 'اكتب هنا';
    inp.setAttribute('aria-label', s.other);
    inp.value = otherOn ? (data[s.id] || '') : '';
    inp.addEventListener('input', () => { data[s.id] = inp.value; setErr(''); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); next.click(); } });
    otherWrap.appendChild(inp);
    body.appendChild(otherWrap);
  }
  next.hidden = !(otherOn || (last && data[s.id]));
}

function commit(s){
  const ok = commitStep(s);
  if (ok && nextId(s.id)) sync(false);
  return ok;
}
function commitStep(s){
  if (s.type === 'choice'){
    if (data[s.id + '__other']){
      const v = (data[s.id] || '').trim();
      if (!v) return setErr('اكتب إجابتك');
      data[s.id] = v;
    } else if (!data[s.id]) return setErr('اختار إجابة');
    return true;
  }
  const el = document.querySelector('#body input, #body textarea');
  let v = el.value.trim();
  if (s.norm) v = s.norm(v);
  if (!v){
    if (s.optional){ delete data[s.id]; return true; }
    return setErr('الخانة دي مطلوبة');
  }
  if (s.validate){ const r = s.validate(v); if (r !== true) return setErr(r); }
  data[s.id] = v;
  return true;
}
function setErr(m){ document.getElementById('err').textContent = m; return false; }

/* ====== الإرسال: بيتحفظ جزئيًا أول ما الرقم يتكتب، ويتحدّث مع كل خطوة ====== */
const SID = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
let sent = false;
function buildPayload(final){
  const p = {sid:SID, final:!!final, name:data.name, phone:data.phone, unitType:data.unitType,
    unitStatus:data.unitStatus, area:data.area, contactTime:data.contactTime, address:data.address, notes:data.notes};
  if (otherGov(data)){ p.governorate = 'محافظة أخرى'; p.district = [data.governorate, data.districtText].filter(Boolean).join(' - '); }
  else { p.governorate = data.governorate; p.district = data.district; }
  if (data.budget){ const i = budgetOptions(data).indexOf(data.budget); if (i > -1){ p.budget = TIERS[i]; p.budgetText = data.budget; } }
  if (SRC) p.src = SRC;
  Object.keys(p).forEach(k => (p[k] === undefined || p[k] === '') && delete p[k]);
  return p;
}
function ready(){ return data.name && /^01[0125]\d{8}$/.test(data.phone || '') && ENDPOINT && !ENDPOINT.startsWith('__'); }
function post(final){
  return fetch(ENDPOINT, {method:'POST', keepalive:true, headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(buildPayload(final))});
}
function sync(final){ if (!ready() || sent) return; post(final).catch(() => {}); }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && ready() && !sent){
    try { navigator.sendBeacon(ENDPOINT, new Blob([JSON.stringify(buildPayload(false))], {type:'text/plain;charset=utf-8'})); } catch(e){}
  }
});

function submit(){
  const next = document.getElementById('next');
  next.hidden = false; next.disabled = true; next.textContent = 'بيتبعت...';
  setErr('');
  const fail = () => {
    next.disabled = false; next.textContent = 'جرب تاني';
    next.onclick = submit;
    setErr('الطلب متبعتش. اتأكد من النت وجرب تاني.');
  };
  if (!ENDPOINT || ENDPOINT.startsWith('__')){ setTimeout(thanks, 600); return; } // وضع المعاينة
  post(true).then(r => r.json()).then(r => { if (r.ok){ sent = true; thanks(); } else fail(); }).catch(fail);
}

const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>';
const CALL_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.2 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .6 3.6 1 1 0 0 1-.2 1z"/></svg>';

function thanks(){
  hdr.hidden = true;
  const msg = encodeURIComponent('أهلاً، أنا ' + (data.name || '') + ' وسجلت بيانات وحدتي في فورم مدار المعمار.');
  view.innerHTML = `
    <section class="center screen">
      <img src="${LOGO}" alt="">
      <h1>وصلنا طلبك</h1>
      <p>شكرًا لثقتك. فريق مدار المعمار هيكلمك في الوقت اللي اخترته. ولو حابب تكلمنا دلوقتي:</p>
      <div class="contact">
        <a class="wa" href="https://wa.me/${WA_NUMBER}?text=${msg}" target="_blank" rel="noopener">${WA_ICON}<span>كلمنا واتساب</span></a>
        <a class="call" href="tel:${CALL_NUMBER}">${CALL_ICON}<span>اتصل بينا دلوقتي</span></a>
      </div>
    </section>
    <p class="sig">مدار المعمار — Madar Architecture</p>`;
}

intro();
</script>
